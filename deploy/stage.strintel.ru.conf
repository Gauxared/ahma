# stage.strintel.ru — СТЕНД СтройИнтеллекта.
#
# ОТДЕЛЬНЫЙ ФАЙЛ, И ЭТО НАМЕРЕННО. Рядом работают боевой strintel.ru и показ на
# app.strintel.ru, у каждого свой сертификат; ошибка в чужом блоке ломает
# работающий сайт, а не стенд. Поэтому здесь не правится ничего чужого.
#
# Отличие от app.strintel.ru — ровно в трёх строках: имя, сертификат и порт
# приложения (3100 вместо 3000). Остальное совпадает НАМЕРЕННО: стенд, ведущий
# себя иначе, чем прод, проверяет не прод.

server {
    listen 80;
    listen [::]:80;
    server_name stage.strintel.ru;

    # Место для проверки владения доменом (certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24: http2 указывается параметром listen. Отдельная директива
    # «http2 on» появилась в 1.25.1 и здесь роняет проверку конфига.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stage.strintel.ru;

    ssl_certificate     /etc/letsencrypt/live/stage.strintel.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stage.strintel.ru/privkey.pem;
    # Настройки TLS прописаны ЯВНО, а не подключением файла certbot: этого
    # файла на сервере нет, и остальные блоки его тоже не подключают. Подключить
    # несуществующее — это отказ проверки конфига, то есть отказ перезагрузки
    # nginx целиком, вместе с работающими сайтами.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # СТЕНД НЕ ПОПАДАЕТ В ПОИСК.
    #
    # Вход открыт, как и на проде, — закрывать его паролем владелец не просил.
    # Но проиндексированный стенд — это вторая копия тех же страниц под тем же
    # брендом: поисковик выбирает между ними сам и может показывать заказчику
    # недоделанное вместо боевого. Запрет индексации никому из людей не мешает.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Партия клиента — это десятки файлов и сотни мегабайт. Умолчание nginx в
    # 1 МБ отклонило бы загрузку на первом же реальном пакете.
    client_max_body_size 512m;

    # Прогон идёт минутами, а страница проверки держит соединение: короткий
    # таймаут оборвал бы её на середине и выглядел бы отказом системы.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
